name: generate cyberpunk snake

on:
  schedule:
    - cron: "0 0 * * *"   # regenerate once a day
  workflow_dispatch:       # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FCEE0A&color_dots=#0D0D0D,#3D0D10,#7A1220,#C41E3A,#FF003C
            dist/github-contribution-grid-snake-dark.svg?color_snake=#FCEE0A&color_dots=#0D0D0D,#3D0D10,#7A1220,#C41E3A,#FF003C

      - name: push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
